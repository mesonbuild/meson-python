[workspace]
name = "meson-python"
description = "The Python build backend for Meson projects"
license = "MIT"
documentation = "https://mesonbuild.com/meson-python"
repository = "https://github.com/mesonbuild/meson-python"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-aarch64"]

[dependencies]
meson = "*"
packaging = ">=24.2"
pyproject-metadata = ">=0.9.0"
ninja = "*"
pkg-config = "*"
cmake = "*"
patchelf = "*"
geos = "*"
pip = "*"
python-build = "*"
cython = "*"
pytest = "*"
pytest-mock = "*"
vcs_versioning = "*"
wheel = "*"

[feature.compilers.dependencies]
c-compiler = "*"
cxx-compiler = "*"

[environments]
default = { features = ["compilers"], solve-group = "test" }
system-compilers = { features = [], solve-group = "test" }

[tasks]
test = { cmd = "pytest", cwd = "../.." }
